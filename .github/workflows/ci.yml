name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reviewed project dependencies
        run: python -m pip install -e '.[dev]'
      - name: Tests without Docker
        run: |
          mkdir -p artifacts
          python -m pytest tests/unit tests/integration/test_benchmark_integration.py -ra --junitxml=artifacts/tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('artifacts/tests.xml').findall('.//testcase')
          assert cases and all(not list(case) for case in cases), 'Test failures or skips'
          PY
      - name: Static checks and package build
        run: |
          python -m mypy src tests examples
          python -m ruff check .
          python -m ruff format --check .
          python -m pip check
          python -m build
      - name: Offline benchmark artifacts
        run: |
          python -m agentforge benchmark run --offline --split all > artifacts/predictions.jsonl
          python -m agentforge benchmark score artifacts/predictions.jsonl --split all > artifacts/benchmark.json
          python -m examples.inspection_adapter > artifacts/adapter-proposal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: checks-${{ matrix.python-version }}
          path: |
            artifacts/*.xml
            artifacts/*.json
            artifacts/*.jsonl
            dist/*.whl
            dist/*.tar.gz
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: error

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AGENTFORGE_TEST_DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Provision reviewed tooling image on disposable hosted runner
        run: |
          mkdir -p artifacts "$RUNNER_TEMP/docker-config"
          docker --host "$AGENTFORGE_TEST_DOCKER_HOST" --config "$RUNNER_TEMP/docker-config" build --iidfile "$RUNNER_TEMP/image-id" scripts/tool-image
          image_id=$(cat "$RUNNER_TEMP/image-id")
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "AGENTFORGE_TEST_IMAGE=$image_id" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/image-id" artifacts/image-id.txt
      - name: Real integrations with no skips
        run: |
          python -m pytest tests/integration -ra --junitxml=artifacts/integration.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('artifacts/integration.xml').findall('.//testcase')
          assert cases and all(not list(case) for case in cases), 'Integration failures or skips'
          PY
      - name: Actual offline smoke and reports
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          from agentforge.core.runner import SuiteResult
          from agentforge.reporting.json_report import load_report
          from agentforge.reporting.html_report import render_html
          runs = Path('runs/ci-smoke')
          command = [sys.executable, '-m', 'agentforge', 'run', '--suite', 'smoke',
                     '--offline', '--runs-root', str(runs), '--docker-host',
                     os.environ['AGENTFORGE_TEST_DOCKER_HOST'], '--image',
                     os.environ['AGENTFORGE_TEST_IMAGE']]
          result = subprocess.run(command, capture_output=True, text=True, timeout=180)
          assert result.returncode == 4, 'Expected offline UNKNOWN, not success or infrastructure failure'
          summaries = list(runs.glob('suite-*/summary.json'))
          assert len(summaries) == 1
          suite = SuiteResult.model_validate_json(summaries[0].read_bytes())
          assert suite.exit_code == 4 and len(suite.attempts) == 2
          for attempt in suite.attempts:
              assert attempt.report and attempt.report.outcome
              assert attempt.report.outcome.category == 'Bullseye'
              assert attempt.report.quality_status == 'INCOMPLETE'
              assert attempt.report.release_decision == 'UNKNOWN'
          document = load_report(runs, suite.run_id)
          Path('artifacts/smoke.json').write_text(document.model_dump_json(indent=2))
          Path('artifacts/smoke.html').write_text(render_html(document))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sandbox-evidence
          path: |
            artifacts/integration.xml
            artifacts/image-id.txt
            artifacts/smoke.json
            artifacts/smoke.html
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: error

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' pip-audit==2.10.1
      - name: Audit installed dependencies without automatic fixes
        run: |
          mkdir -p artifacts
          python -m pip_audit --strict --skip-editable --format json --output artifacts/dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audit
          path: artifacts/dependency-audit.json
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: error
